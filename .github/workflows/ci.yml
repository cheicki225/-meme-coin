name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify PAPER mode is the default
        run: |
          python - <<'PY'
          import os
          os.environ.pop("TRADING_MODE", None)
          import config
          assert config.TRADING_MODE.upper() == "PAPER", config.TRADING_MODE
          print("Default trading mode: PAPER")
          PY

      - name: Run unit tests
        run: |
          coverage run --branch --source=. --omit='tests/*,test_*.py,.venv/*,venv/*' -m pytest -q
          coverage report --precision=2
          coverage json -o coverage.json
          coverage xml -o coverage.xml

      - name: Lint critical errors
        run: ruff check --select E9,F63,F7,F82 .

      - name: Audit dependencies
        run: pip-audit -r requirements-ci.txt

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-coverage-${{ github.run_id }}
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: ignore
